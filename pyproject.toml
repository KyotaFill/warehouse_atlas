[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-atlas"
version = "0.1.0"
description = "Hệ thống quản lý kho thông minh (Desktop WMS) điều hành kho phân phối hàng đóng gói theo lô"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Warehouse Atlas Team" }
]
dependencies = [
    "SQLAlchemy>=2.0.30,<2.1.0",
    "psycopg[binary]>=3.1.18,<3.2.0",
    "alembic>=1.13.1,<1.14.0",
    "pydantic>=2.7.1,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "ttkbootstrap>=1.10.1,<1.11.0",
    "networkx>=3.2.1,<4.0.0",
    "httpx>=0.27.0,<0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
